# MQTT Listener
listener 1883
protocol mqtt

# WebSocket Listener
listener 9001
protocol websockets

# Authentication (allow anonymous for development)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Connection settings
max_keepalive 120
max_connections -1

# Message settings
max_queued_messages 1000
message_size_limit 10485760

# Performance
max_inflight_messages 20
max_queued_bytes 0